
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | FALCONI-GIT</title>

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./responsive.css">

    <script src="./translations.js" defer></script>
    <script src="./language.js" defer></script>
    <script src="./reset-password.js" defer></script>
    <link rel="stylesheet" href="./premium-card.css">
    <script src="./premium-card.js" defer></script>
</head>

<body>
    <main class="page">

        <section class="brand-panel">
            <header class="brand-header">
                <div class="logo-box">
                    <img src="./assets/images/logo.png" alt=""
                         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                    <span class="logo-fallback">F.</span>
                </div>
                <span class="brand-name">FALCONI-GIT</span>
            </header>

            <div class="brand-content">
                <div class="eyebrow">
                    <span class="eyebrow-dot"></span>
                    <span data-i18n="brandTagline">
                        TU ESPACIO FINANCIERO EN ₽
                    </span>
                </div>

                <h1 class="brand-title">
                    <span data-i18n="brandTitleLine1"
                          style="color:inherit">Tu dinero.</span><br>
                    <span data-i18n="brandTitleLine2"
                          style="color:inherit">Tu espacio.</span><br>
                    <span data-i18n="brandTitleLine3">Tu control.</span>
                </h1>

                <div class="card-stage">
                    <div class="finance-card" aria-hidden="true">
                        <div class="card-diagonal-one"></div>
                        <div class="card-diagonal-two"></div>
                        <div class="card-texture"></div>
                        <div class="card-chip"></div>
                        <div class="card-mark">
                            <strong>F.</strong>
                            <span>FALCONI</span>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="brand-footer" data-i18n="brandFooter">
                Más claridad. Más control. Todo en rublos.
            </footer>
        </section>

        <section class="auth-panel">
            <header class="auth-top">
                <select id="language" class="language-select"
                        aria-label="Idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                </select>
            </header>

            <div class="auth-content">
                <div class="auth-heading">
                    <p class="auth-label">FALCONI-GIT</p>
                    <h2 class="auth-title" data-i18n="resetTitle">
                        Nueva contraseña
                    </h2>
                    <p class="auth-description"
                       data-i18n="resetDescription">
                        Crea una nueva contraseña para tu cuenta.
                    </p>
                </div>

                <form id="resetForm" class="login-form">
                    <div class="form-group">
                        <label for="password" class="form-label"
                               data-i18n="password">
                            Contraseña
                        </label>

                        <input id="password"
                               class="form-input"
                               type="password"
                               autocomplete="new-password"
                               minlength="8"
                               maxlength="128"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword"
                               class="form-label"
                               data-i18n="confirmPassword">
                            Confirmar contraseña
                        </label>

                        <input id="confirmPassword"
                               class="form-input"
                               type="password"
                               autocomplete="new-password"
                               required>
                    </div>

                    <button class="submit-button" type="submit">
                        <span data-i18n="savePassword">
                            Guardar contraseña
                        </span>
                        <span aria-hidden="true">→</span>
                    </button>

                    <p id="resetStatus" class="form-status"
                       role="status"></p>
                </form>

                <div class="register-area">
                    <a href="./index.html" class="text-link"
                       data-i18n="backToLogin">
                        ← Volver al inicio
                    </a>
                </div>
            </div>

            <footer class="auth-footer">
                <span>© 2026 FALCONI-GIT</span>
                <span data-i18n="development">
                    Interfaz en desarrollo
                </span>
            </footer>
        </section>
    </main>
</body>
</html>
